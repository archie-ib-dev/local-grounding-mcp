[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-grounding-mcp"
version = "0.1.0.dev0"
description = "Privacy-first visual grounding fallback with local inference and DOM-visual hybrid routing for MCP browser agents."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Local Grounding MCP contributors" }]
keywords = ["mcp", "visual-grounding", "browser-agents", "local-inference", "computer-use"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp>=1.28,<2",
  "torch",
  "torchvision",
  "transformers",
  "pillow",
  "qwen-vl-utils",
]

[project.scripts]
local-grounding-mcp = "local_grounding_mcp.cli:adapter_main"
local-grounding-service = "local_grounding_mcp.cli:service_main"
local-grounding-doctor = "local_grounding_mcp.cli:doctor_main"
local-grounding-status = "local_grounding_mcp.cli:status_main"
local-grounding-stop = "local_grounding_mcp.cli:stop_main"
local-grounding-metrics = "local_grounding_mcp.cli:metrics_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
